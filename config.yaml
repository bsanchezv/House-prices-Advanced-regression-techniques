data:
  train_path: data/raw/train.csv
  test_path: data/raw/test.csv

base:
  RANDOM_SEED: 20

modeling:
  TARGET_COLUMN: 'SalePrice'
  VALID_SIZE: 0.2

# hyperparameters:
#   RIDGE_ALPHAS: [0.011, 0.1, 1.0, 10.0, 100.0]
#   LASSO_ALPHAS: [0.0001, 0.001, 0.01, 0.1, 1.0]
#   ELASTICNET_L1_RATIO: 0.5

hyperparameters:
  # Agregamos valores más pequeños (0.01, 0.001) para Ridge
  RIDGE_ALPHAS: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  
  # Agregamos valores MUCHO más pequeños (1e-5, 1e-4) para Lasso
  LASSO_ALPHAS: [0.00001, 0.0001, 0.001, 0.01, 0.1, 1.0]
  
  ELASTICNET_L1_RATIO: 0.5